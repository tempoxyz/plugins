name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Package plugins
        run: |
          mkdir -p dist/releases
          for plugin in tempo-docs tempo-wallet mercator; do
            tar -C plugins -czf "dist/releases/${plugin}.tar.gz" "$plugin"
            (cd plugins && zip -qr "../dist/releases/${plugin}.zip" "$plugin")
            (cd dist/gemini && zip -qr "../releases/${plugin}-gemini.zip" "$plugin")
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/* --generate-notes --verify-tag
